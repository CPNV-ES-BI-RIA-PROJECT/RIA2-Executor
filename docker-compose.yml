services:
  mariadb:
    image: mariadb:${DB_VERSION}
    container_name: mariadb
    restart: unless-stopped
    ports:
      - "${DB_EXPOSED_PORT}:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 10
  app:
    build: .
    image: executor:latest
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    env_file:
      - .env
    volumes:
      - ./bi1-julien.json:/app/bi1-julien.json:ro
      - ./data:/app/data
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /app/bi1-julien.json
      SERVER_PORT: ${SERVER_PORT:-8080}
  bucket-adapter-sql-bridge:
    image: ghcr.io/cpnv-es-bi-ria-project/ria2-sql-bridge-bucket-adapter:stage
    container_name: bucket-adapter-sql-bridge
    ports:
      - "${BUCKET_ADAPTER_SQL_BRIDGE_SERVER_PORT:-8084}:${BUCKET_ADAPTER_SQL_BRIDGE_SERVER_PORT:-8084}"
    environment:
      SERVER_PORT: ${BUCKET_ADAPTER_SQL_BRIDGE_SERVER_PORT}
      PROVIDER_IMPL: ${PROVIDER_IMPL}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
volumes:
  mariadb_data:
